server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location ~* \.(?:js|mjs|css|map|json|ico|svg|png|jpe?g|gif|webp|avif|woff2?|ttf|eot|txt|xml|wasm)$ {
        try_files $uri =404;
    }
}
