server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Resolve ipaas-api via Docker's embedded DNS at request time (not at
        # nginx startup), so this container can start before ipaas-api does -
        # a variable in proxy_pass forces per-request resolution instead of a
        # one-time lookup that would fail if the API isn't up yet.
        resolver 127.0.0.11 valid=30s;
        set $api_upstream http://ipaas-api:3000;
        proxy_pass $api_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location ~* \.(?:js|mjs|css|map|json|ico|svg|png|jpe?g|gif|webp|avif|woff2?|ttf|eot|txt|xml|wasm)$ {
        try_files $uri =404;
    }
}
