name: Build & Publish Orchestration Engine Image

# Branch model: feature -> dev -> main. A build+publish happens whenever
# reviewed code lands on `dev` (i.e. a feature branch's PR is approved and
# merged) — not on every feature-branch push, and not (yet) on `main`.
# See docs/LLD-orchestration-engine.md ("Containerization") for why.
on:
  push:
    branches: [dev]
    paths:
      - "lib/orchestration/**"
      - "lib/mapping/**"
      - "lib/*.js"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/build-orchestration-engine.yml"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ipaas-orchestration-engine:dev-latest
            ghcr.io/${{ github.repository_owner }}/ipaas-orchestration-engine:dev-${{ steps.vars.outputs.sha_short }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ipaas-orchestration-engine:dev-latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ipaas-orchestration-engine:dev-${{ steps.vars.outputs.sha_short }}
