name: Deploy iPaaS UI

# Runs two ways:
#   - Automatically, called by build-ui.yml's publish job on every successful
#     push to dev - no manual step needed for the normal case.
#   - Manually (workflow_dispatch), for redeploying/rolling back to a
#     specific previously-published SHA/tag/digest without a new push.

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      image_digest:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full SHA of a previously verified dev publication
        required: true
        type: string
      image_tag:
        description: Full GHCR dev-<sha>-<run_id>-<attempt> tag for that publication
        required: true
        type: string
      image_digest:
        description: Published sha256 digest for that exact release
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: ui-dev-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Windows, TL621-1]
    timeout-minutes: 15
    steps:
      - name: Checkout trusted deployment definition
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Isolate registry credentials
        shell: powershell
        run: |
          $configPath = Join-Path $env:RUNNER_TEMP "ipaas-cd-docker-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "DOCKER_CONFIG=$configPath" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Authenticate image pull
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Deploy and verify UI container
        shell: powershell
        env:
          DEPLOY_SHA: ${{ inputs.source_sha }}
          DEPLOY_IMAGE_TAG: ${{ inputs.image_tag }}
          DEPLOY_IMAGE_DIGEST: ${{ inputs.image_digest }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          $ErrorActionPreference = 'Stop'
          $metadataPath = [IO.Path]::GetTempFileName()
          try {
            @{ sourceSha = $env:DEPLOY_SHA; image = $env:DEPLOY_IMAGE_TAG; digest = $env:DEPLOY_IMAGE_DIGEST } |
              ConvertTo-Json | Set-Content -LiteralPath $metadataPath
            & ./ipaas.ui/deploy/deploy.ps1 -MetadataPath $metadataPath -ExpectedSha $env:DEPLOY_SHA -RepositoryOwner $env:REPOSITORY_OWNER
          } finally {
            Remove-Item -LiteralPath $metadataPath -Force
          }
