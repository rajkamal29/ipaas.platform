name: Build & Publish iPaaS UI Image

on:
  push:
    branches: ["features/**", dev]
    paths:
      - "ipaas.ui/**"
      - ".github/workflows/build-ui.yml"
      - ".github/workflows/deploy-ui.yml"
  pull_request:
    branches: [dev]
    paths:
      - "ipaas.ui/**"
      - ".github/workflows/build-ui.yml"
      - ".github/workflows/deploy-ui.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ipaas.ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ipaas.ui/.nvmrc
          cache: npm
          cache-dependency-path: ipaas.ui/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test -- --watch=false

      - name: Build production UI
        run: npm run build:production

  publish:
    name: Publish UI image to GHCR
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image metadata
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ipaas-ui"
          short_sha="${GITHUB_SHA:0:7}"
          echo "tag=${image}:dev-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${image}:dev-latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push UI image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./ipaas.ui
          file: ./ipaas.ui/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.latest_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Record published image
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          LATEST_TAG: ${{ steps.image.outputs.latest_tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          {
            echo "Source SHA (use as source_sha for Deploy iPaaS UI): ${SOURCE_SHA}"
            echo "Image (use as image_tag for Deploy iPaaS UI): ${IMAGE_TAG}"
            echo "Digest (use as image_digest for Deploy iPaaS UI): ${IMAGE_DIGEST}"
            echo "Also tagged: ${LATEST_TAG} (convenience only - never use for deploy input)"
          } >> "$GITHUB_STEP_SUMMARY"
