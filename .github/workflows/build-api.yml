name: Build & Publish iPaaS API Image

on:
  pull_request:
    branches: [dev]
    paths:
      - "ipaas.api/**"
      - ".github/workflows/build-api.yml"
      - ".github/workflows/deploy-api.yml"
  push:
    branches: [dev]
    paths:
      - "ipaas.api/**"
      - ".github/workflows/build-api.yml"
      - ".github/workflows/deploy-api.yml"

permissions:
  contents: read

concurrency:
  group: api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and build API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ipaas.api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ipaas.api/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build production API
        run: npm run build

      - name: Test deployment safety with a fake Docker boundary
        shell: pwsh
        run: ./deploy/test-deploy.ps1

  publish:
    name: Publish API image to GHCR
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image metadata
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ipaas-api"
          echo "source_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image}:dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${image}:dev-latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./ipaas.api
          file: ./ipaas.api/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.latest_tag }}
            ${{ steps.image.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ipaas-api
          cache-to: type=gha,mode=max,scope=ipaas-api

      - name: Record published image
        env:
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
          LATEST_TAG: ${{ steps.image.outputs.latest_tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ steps.image.outputs.source_sha }}
        run: |
          {
            echo "Source SHA: ${SOURCE_SHA}"
            echo "Image: ${IMAGE_TAG}"
            echo "Digest: ${IMAGE_DIGEST}"
            echo "Also tagged: ${LATEST_TAG} (convenience only - never used as a deploy input)"
            echo "Deploy: manual only. Run the 'Deploy iPaaS API' workflow with these three values as its workflow_dispatch inputs when you're ready to deploy - nothing redeploys automatically on push."
            echo ""
            echo "Dispatch command:"
            echo "gh workflow run deploy-api.yml --ref dev -f source_sha=${SOURCE_SHA} -f image_tag=${IMAGE_TAG} -f image_digest=${IMAGE_DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"
