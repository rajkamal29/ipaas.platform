name: Deploy iPaaS API

# Manual only, by design: build-api.yml's publish job runs on every push to
# dev, but nothing redeploys until this workflow is dispatched deliberately.
#
# Targeting: every teammate registers their own self-hosted runner under the
# SAME custom label - "ipaasrunner" - and, by team convention, keeps only
# their own runner online/listening at a time (a one-time setup, enforced
# socially, not technically). Whoever currently has their runner online is
# the one this deploys to when they dispatch it, without hardcoding or
# selecting any specific person's machine in this file. If more than one
# runner with this label is online at once, GitHub picks whichever is idle -
# that's the one thing this convention has to hold for targeting to stay
# predictable.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full SHA of a previously verified dev publication
        required: true
        type: string
      image_tag:
        description: Full GHCR dev-<short-sha> tag for that publication
        required: true
        type: string
      image_digest:
        description: Published sha256 digest for that exact release
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: api-dev-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Windows, ipaasrunner]
    timeout-minutes: 15
    steps:
      - name: Checkout trusted deployment definition
        uses: actions/checkout@v4
        with:
          # github.sha, not github.workflow_sha: with no workflow_call caller
          # in play here, github.sha already resolves to the exact commit this
          # workflow_dispatch was run against - that's what the deploy scripts
          # below need to be checked out from.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Isolate registry credentials
        shell: powershell
        run: |
          $configPath = Join-Path $env:RUNNER_TEMP "ipaas-cd-docker-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "DOCKER_CONFIG=$configPath" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Authenticate image pull
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Deploy and verify API container
        shell: powershell
        env:
          DEPLOY_SHA: ${{ inputs.source_sha }}
          DEPLOY_IMAGE_TAG: ${{ inputs.image_tag }}
          DEPLOY_IMAGE_DIGEST: ${{ inputs.image_digest }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          . ./ipaas.api/deploy/local-demo.ps1
          Initialize-ApiDeploymentEnvironment
          $metadataPath = [IO.Path]::GetTempFileName()
          try {
            @{ sourceSha = $env:DEPLOY_SHA; image = $env:DEPLOY_IMAGE_TAG; digest = $env:DEPLOY_IMAGE_DIGEST } |
              ConvertTo-Json | Set-Content -LiteralPath $metadataPath
            & ./ipaas.api/deploy/deploy.ps1 -MetadataPath $metadataPath -ExpectedSha $env:DEPLOY_SHA -RepositoryOwner $env:REPOSITORY_OWNER
          } finally {
            Remove-Item -LiteralPath $metadataPath -Force
          }
