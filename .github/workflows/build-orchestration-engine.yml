name: Build & Publish Orchestration Engine Image

# Branch model: feature -> dev -> main. Feature-branch pushes and PRs into
# `dev` run setup, validation, and an image build without publishing.
# Reviewed code pushed to `dev` also publishes the image to GHCR.
# See ipaas.orchestrationengine/docs/LLD-orchestration-engine.md
# ("Containerization") for why.
#
# 2026-09-10: moved here from ipaas.orchestrationengine/.github/workflows/ -
# GitHub Actions only discovers workflow files under .github/workflows/ at
# the actual repository root, not inside a subfolder's own .github/workflows/.
# Until the real 3-repo split happens, this repo root is ipaas.platform
# itself, so this is the only location where this workflow actually runs -
# it never ran from its old location.
on:
  pull_request:
    branches: [dev]
    paths:
      - "ipaas.orchestrationengine/lib/orchestration/**"
      - "ipaas.orchestrationengine/lib/mapping/**"
      - "ipaas.orchestrationengine/lib/*.js"
      - "ipaas.orchestrationengine/package.json"
      - "ipaas.orchestrationengine/package-lock.json"
      - "ipaas.orchestrationengine/Dockerfile"
      - "ipaas.orchestrationengine/.dockerignore"
      - "ipaas.orchestrationengine/.npmrc"
      - ".github/workflows/build-orchestration-engine.yml"
  push:
    branches:
      - dev
      - "features/**"
    paths:
      - "ipaas.orchestrationengine/lib/orchestration/**"
      - "ipaas.orchestrationengine/lib/mapping/**"
      - "ipaas.orchestrationengine/lib/*.js"
      - "ipaas.orchestrationengine/package.json"
      - "ipaas.orchestrationengine/package-lock.json"
      - "ipaas.orchestrationengine/Dockerfile"
      - "ipaas.orchestrationengine/.dockerignore"
      - "ipaas.orchestrationengine/.npmrc"
      - ".github/workflows/build-orchestration-engine.yml"
  workflow_dispatch: {}

concurrency:
  group: orchestration-engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Set up and build application
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ipaas.orchestrationengine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ipaas.orchestrationengine/package-lock.json
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build validation
        shell: bash
        run: find lib -name '*.js' -print0 | xargs -0 -n1 node --check

  image:
    name: Build and publish image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Short SHA
        id: vars
        shell: bash
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish
        uses: docker/build-push-action@v6
        with:
          context: ./ipaas.orchestrationengine
          file: ./ipaas.orchestrationengine/Dockerfile
          push: ${{ github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' }}
          # Lets the Dockerfile's `RUN --mount=type=secret,id=npm_token`
          # read a GitHub Packages token for the single npm ci instruction
          # that needs it, without it ever landing in an image layer.
          # GITHUB_TOKEN has read:packages for this repo's own packages,
          # which is all @rajkamal29/adapter-connectwise/keka need.
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ipaas-orchestration-engine:dev-latest
            ghcr.io/${{ github.repository_owner }}/ipaas-orchestration-engine:dev-${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=ipaas-orchestration-engine
          cache-to: type=gha,mode=max,scope=ipaas-orchestration-engine
