name: Provision entity runtime
run-name: Provision sync entity ${{ inputs.sync_entity_id }}

on:
  workflow_dispatch:
    inputs:
      sync_entity_id:
        description: Existing sync_entities UUID in provisioning status
        required: true
        type: string
      image_reference:
        description: Must match the provider pair in the approved image catalogue
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: provision-sync-entity-${{ inputs.sync_entity_id }}
  cancel-in-progress: false

jobs:
  provision-runtime:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ipaas.provisioningengine
    env:
      RUNTIME_PROVIDER: docker
      SYNC_ENTITY_ID: ${{ inputs.sync_entity_id }}
      EXPECTED_RUNTIME_IMAGE: ${{ inputs.image_reference }}
      DOCKER_NETWORK: ipaas-network
      DOCKER_SOCKET_PATH: //./pipe/docker_engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed." }
      - name: Build provisioning entry point
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "Build failed." }
      - name: Provision the validated entity through the Docker adapter
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Temporary demo: secrets stay in this PowerShell process and its child.
          . ./deploy/local-demo.ps1
          Initialize-LocalDemoEnvironment -Mode runtime
          if ([string]::IsNullOrWhiteSpace($env:SYNC_ENTITY_ID)) { throw "SYNC_ENTITY_ID is required for explicit runtime execution." }
          if ([string]::IsNullOrWhiteSpace($env:EXPECTED_RUNTIME_IMAGE)) { throw "EXPECTED_RUNTIME_IMAGE is required for explicit runtime execution." }
          npm start
          if ($LASTEXITCODE -ne 0) { throw "Entity provisioning failed; inspect correlated lifecycle logs." }
