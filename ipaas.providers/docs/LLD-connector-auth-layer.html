<h1 id="lld--connector--auth-layer">LLD — Connector &amp; Auth Layer</h1>
<p>Status: Client entity implemented and verified live (<code>connectwise/index.js</code>, <code>keka/index.js</code>, this repo). Project and Timesheet extension is planned, not yet implemented — endpoints below are best guesses pending live verification (§4a, §5a).</p>
<h2 id="revision-history">Revision history</h2>
<ol>
<li>Original draft assumed webhooks and Nango for Keka.</li>
<li>Revised to polling-only, Keka as a fully custom adapter, Client-only scope, after real credentials showed client-credentials-style auth.</li>
<li>Both connectors were called live (via a throwaway test script) and the design was revised to reflect confirmed real behavior — endpoint paths, field names, and pagination — instead of documented guesses. This also confirmed custom adapters over an OSS tool like Nango was still the right call for both systems, since neither involves an interactive OAuth consent step Nango would simplify. Implemented shortly after as <code>lib/adapters/connectwise.js</code> and <code>lib/adapters/keka.js</code>.</li>
<li><strong>This revision:</strong> extending scope from Client-only to Project and Timesheet, following the same live-verification discipline as revision 3 — see §4a and §5a. Endpoints there are best guesses, not yet confirmed.</li>
</ol>
<h2 id="1-purpose">1. Purpose</h2>
<p>Fetches and writes Client/Company data between ConnectWise and Keka, and securely stores/retrieves the credentials both systems need — via a uniform interface so the Orchestration Engine doesn't need to know it's talking to two differently-authenticated, differently-paginated systems.</p>
<h2 id="2-scope">2. Scope</h2>
<p><strong>In scope:</strong> a common connector adapter contract both systems implement; the ConnectWise adapter (API Member auth), covering Client (implemented) and Project/Time Entry (planned, §4a); the Keka adapter (client-credentials auth), covering Client (implemented) and Project/Timesheet (planned, §5a); pagination handling; how credentials get encrypted and persisted into <code>credentials</code>; surfacing clean, typed errors for the Orchestration Engine's retry policy.</p>
<p><strong>Out of scope:</strong> webhook receivers; field mapping/transformation (Mapping &amp; Transformation Engine); sync scheduling itself (Orchestration Engine — this layer only implements <code>fetch</code>/<code>write</code>, it doesn't decide when they run); the encryption algorithm's implementation code (defined here at the design level, written only once implementation is approved).</p>
<h2 id="3-connector-adapter-interface">3. Connector Adapter Interface</h2>
<table>
<thead>
<tr class="header">
<th>Method</th>
<th>Responsibility</th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td><code>authenticate(connectorId)</code></td>
<td>Ensure a valid token is available — for Keka, calls the token endpoint if the cached token has expired; for ConnectWise, a no-op</td>
</tr>
<tr class="even">
<td><code>fetch(entity, { pageNumber, pageSize, modifiedSince })</code></td>
<td>Pull one page of records for an entity. Returns a <strong>normalized shape regardless of which system it's calling</strong>: <code>{ records: [...], pageNumber, totalPages, hasMore }</code>. The adapter is responsible for translating each system's own pagination mechanism into this shape — see §7.</td>
</tr>
<tr class="odd">
<td><code>write(entity, record)</code></td>
<td>Push a single target-shaped record to the system</td>
</tr>
</tbody>
</table>
<p>Page-aware, not "fetch everything internally" — confirmed as the right call now that both systems report a <code>totalPages</code>/page-count, meaning the Orchestration Engine can iterate pages as separate, checkpointed steps against <code>sync_state</code> (bounded execution time, resumable if one page fails) rather than one large blocking call.</p>
<h2 id="4-connectwise-adapter--confirmed-against-a-live-call">4. ConnectWise Adapter — confirmed against a live call</h2>
<table>
<tbody>
<tr class="odd">
<td>Auth type</td>
<td><code>api_key</code> (API Member) — <strong>confirmed working</strong>, 200 response</td>
</tr>
<tr class="even">
<td>Auth mechanism</td>
<td><code>Authorization: Basic base64(companyId+publicKey:privateKey)</code> + <code>clientId</code> header</td>
</tr>
<tr class="odd">
<td>Endpoint (this iteration)</td>
<td><code>GET {baseUrl}{apiVersion}/company/companies</code> → canonical Client</td>
</tr>
<tr class="even">
<td>Pagination</td>
<td>Page-based via the <code>Link</code> response header (<code>rel="next"</code>, <code>rel="last"</code>) — e.g. <code>...?pageSize=1&amp;page=2</code>. No page-count field in the body; the last page number comes from parsing <code>rel="last"</code> out of the header.</td>
</tr>
<tr class="odd">
<td>Incremental cursor</td>
<td><code>_info.lastUpdated</code> on each record (ISO 8601) — use as the modified-since watermark</td>
</tr>
<tr class="even">
<td>Real fields observed</td>
<td><code>id, identifier, name, status{id,name}, addressLine1, addressLine2, city, state, zip, country{...}, phoneNumber, website, types[{...}], site{...}, _info{lastUpdated, updatedBy, dateEntered, contacts_href, ...}</code></td>
</tr>
<tr class="odd">
<td><strong>Decision: primary contact left null</strong></td>
<td>Primary contact name/email is <strong>not embedded</strong> in the Company record — it's a separate resource at <code>_info.contacts_href</code>. Decided: leave canonical <code>primaryContactName</code>/<code>primaryContactEmail</code> null rather than adding a second API call per company — they're already optional in the canonical schema, so this doesn't break anything. Revisit only if a future tenant/demo actually needs contact data.</td>
</tr>
</tbody>
</table>

<h2 id="6-credential-storage--acquisition-flow">6. Credential Storage &amp; Acquisition Flow</h2>
<p><strong>Postgres only — no connector credentials are ever stored in <code>.env</code>.</strong> <code>.env</code> holds only platform bootstrap secrets: the Postgres connection and <code>ENCRYPTION_MASTER_KEY</code>, the key used to encrypt everything below.</p>
<p>The <code>credentials</code> table holds the actual per-connector config and secrets: one row per <code>(tenant_id, provider)</code> (unique constraint enforced), ciphertext/IV/auth tag stored as three separate columns (AES-256-GCM) rather than bundled into one blob. Full column list: <code>ipaas.infra/docs/migrations/README.md</code>'s <code>credentials</code> section.</p>
<p><strong>Acquisition flow:</strong></p>
<ol>
<li>Real credentials are gathered into a JSON file matching the shape each adapter's constructor expects, then encrypted and inserted via <code>ipaas.orchestrationengine/scripts/seed-credentials.js &lt;tenant_id&gt; &lt;provider&gt; &lt;path-to-json&gt;</code> (see <code>docs/setup/TENANT_ONBOARDING.md</code>) — upserts on <code>(tenant_id, provider)</code>, so re-running it is also how a rotated credential gets updated. For local/mock development, <code>scripts/seed-mock-credentials.js &lt;tenant_id&gt;</code> does the same thing with fake values pointed at the mock server — no JSON file, no real account needed.</li>
<li>The plaintext JSON file is deleted once the script confirms success — the only copy of the secret from then on is the encrypted row in Postgres.</li>
<li>At runtime, an adapter decrypts its connector's row in memory. For Keka, the refreshed <code>accessToken</code>/<code>tokenExpiresAt</code> are written back into the same encrypted row after each token refresh.</li>
</ol>
<h2 id="7-pagination--sync-trigger">7. Pagination &amp; Sync Trigger</h2>
<p>No webhook receiver — the Orchestration Engine drives fetching, on a schedule or manually for one-time push. Concretely, for a full sync of an entity:</p>
<ol>
<li>Orchestration Engine calls <code>fetch(entity, { pageNumber: 1, pageSize: 100, modifiedSince: &lt;last watermark&gt; })</code>.</li>
<li>Adapter normalizes the response — for ConnectWise, parses <code>totalPages</code> out of the <code>Link</code> header; for Keka, reads <code>totalPages</code> directly from the body — and returns <code>{ records, pageNumber, totalPages, hasMore }</code>.</li>
<li>Orchestration Engine processes that page's records (via the Mapping Engine), then calls <code>fetch()</code> again for <code>pageNumber + 1</code> if <code>hasMore</code>, checkpointing progress to <code>sync_state</code> after each page so a crash mid-run is resumable.</li>
<li>After the last page, <code>sync_state.cursor</code> is updated to the latest <code>lastUpdated</code>/<code>lastModified</code> value seen, for the next run's incremental fetch.</li>
</ol>
<h2 id="8-integration-points">8. Integration Points</h2>
<ul>
<li><strong>Data &amp; Secrets Store</strong> — reads/writes the encrypted <code>credentials</code> row for each connector; Orchestration Engine reads/writes <code>sync_state</code> for the pagination/incremental cursor.</li>
<li><strong>Mapping &amp; Transformation Engine</strong> — receives this layer's raw fetched records (one page at a time); returns target-shaped records for this layer to write.</li>
<li><strong>Orchestration Engine</strong> — drives the page-by-page fetch loop described in §7 and owns retry policy per page. This layer throws typed errors (auth failure, rate limit, not-found) rather than retrying internally.</li>
</ul>

<li><strong>ConnectWise rate limits</strong> — not yet tested under real load; confirm before scheduled-sync polling frequency is finalized.</li>

<li><strong>Keka <code>write()</code> still unverified against the real API</strong> — risk noted in §5a's "write() risk" row.</li>
<li><strong>Parent-reference field names</strong> (Project → Company, Timesheet → Project) — needed for canonical <code>clientId</code>/<code>projectId</code> fields (see <code>LLD-mapping-engine.md</code>); tracked in §4a's and §5a's "Known dependency" rows.</li>
